<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HayatPlanım</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>HayatPlanım</h1>

        <div class="input-area">
            <input
                type="text"
                id="taskInput"
                placeholder="Yapılacak bir şey yazın..."
            >

            <button id="addButton">
                Ekle
            </button>
        </div>

        <div class="list-header">
            <span>Görevlerim</span>

            <button id="clearAllButton">
                Tümünü Sil
            </button>
        </div>

        <div id="taskList"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
